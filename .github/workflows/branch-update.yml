name: Branch update
on:
  push:
    branches: [publication-controller-01]
permissions:
  contents: read
  pull-requests: write
jobs:
  update:
    if: github.repository == 'mohanad-hafez/infrahub-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repeat: [2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.0.0'
      - name: Update comment
        run: node publication/recover_comments.cjs '${{ matrix.repeat }}'
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: comment-recovery-${{ matrix.repeat }}
          path: publication/recovery-${{ matrix.repeat }}/
          retention-days: 30
