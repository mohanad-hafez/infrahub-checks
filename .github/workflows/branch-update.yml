name: Branch update
on:
  push:
    branches: [publication-controller-01]
permissions:
  contents: write
  pull-requests: write
jobs:
  publish:
    if: github.repository == 'mohanad-hafez/infrahub-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.0.0'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mohanad-hafez/infrahub-checks
          ref: 418c58a723bdba4697c28558330377deabd79870
          path: input-source
          persist-credentials: false
          fetch-depth: 1
      - name: Apply prepared commits
        run: node publication/run.cjs '${{ matrix.repeat }}' input-source
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-${{ matrix.repeat }}
          path: publication/evidence-${{ matrix.repeat }}/
          retention-days: 30
